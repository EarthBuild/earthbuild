// A minimal transcription of the REAPI messages this engine emits.
//
// Field numbers and types are copied from
// build/bazel/remote/execution/v2/remote_execution.proto, so protoc's encoding
// of this is byte-identical to its encoding of the real thing for any message
// using only these fields. Transcribed rather than vendored to avoid REAPI's
// import chain (google/api, google/longrunning, google/rpc), none of which the
// Directory messages need.
syntax = "proto3";

package build.bazel.remote.execution.v2;

message Digest {
  string hash = 1;
  int64 size_bytes = 2;
}

message NodeProperty {
  string name = 1;
  string value = 2;
}

message NodeProperties {
  repeated NodeProperty properties = 1;
  // mtime = 2 and unix_mode = 3 are google.protobuf wrappers this engine never
  // sets; an unset message field emits nothing, so omitting them here cannot
  // change the bytes.
}

message FileNode {
  string name = 1;
  Digest digest = 2;
  reserved 3;
  bool is_executable = 4;
  reserved 5;
  NodeProperties node_properties = 6;
}

message DirectoryNode {
  string name = 1;
  Digest digest = 2;
}

message SymlinkNode {
  string name = 1;
  string target = 2;
  reserved 3;
  NodeProperties node_properties = 4;
}

message Directory {
  repeated FileNode files = 1;
  repeated DirectoryNode directories = 2;
  repeated SymlinkNode symlinks = 3;
  reserved 4;
  NodeProperties node_properties = 5;
}
