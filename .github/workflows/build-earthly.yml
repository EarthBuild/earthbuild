name: Earth Build

on:
  workflow_call:
    inputs:
      BUILT_EARTH_PATH:
        required: true
        type: string
      BINARY:
        required: true
        type: string
      SUDO:
        type: string
        required: false
      RUNS_ON:
        required: true
        type: string
      SKIP_JOB:
        required: false
        type: boolean
        default: false
      USE_NEXT:
        required: false
        type: boolean
        default: false
    secrets:
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false

permissions: {}

env:
  OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES != '' && format('{0},', vars.OTEL_RESOURCE_ATTRIBUTES) || '' }}${{ github.event.pull_request != null && format('vcs.repository.change.id={0},vcs.repository.change.title={1},', github.event.pull_request.number, github.event.pull_request.title) || '' }}cicd.pipeline.run.id=${{ github.run_number }},cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},cicd.pipeline.name=${{ github.workflow }},vcs.revision.id=${{ github.sha }},vcs.ref.name=${{ github.ref_name }},vcs.repository.name=${{ github.repository }},user.id=${{ github.actor }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

jobs:

  build-earthly:
    name: build (and push) earthly using ${{inputs.BINARY}} and earthly-next=${{inputs.USE_NEXT}}
    if: ${{!inputs.SKIP_JOB}}
    runs-on: ${{inputs.RUNS_ON}}
    # Needed for the +ci-release target to push to the GitHub Container Registry for later builds
    permissions:
      contents: read
      packages: write
    env:
      # Use fixed buildkitd image with Docker 29+ ulimit fix until next release
      EARTH_BUILDKIT_IMAGE: ghcr.io/earthbuild/earthbuild:buildkitd-v0.8.17-fix.1
    steps:
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          # Authenticate the release-list API call so it isn't rate-limited on
          # shared runner IPs (unauthenticated is 60 req/hr/IP).
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: "Put back the git branch into git (EarthBuild uses it for tagging)"
        run: |
          branch=""
          if [ -n "$GITHUB_HEAD_REF" ]; then
            branch="$GITHUB_HEAD_REF"
          else
            branch="${GITHUB_REF##*/}"
          fi
          git checkout -b "$branch" || true
      - name: remove Docker
        run: ${INPUTS_SUDO} apt-get purge docker-engine docker docker.io docker-ce docker-ce-cli ; ${INPUTS_SUDO} rm -rf /usr/bin/docker
        if: inputs.BINARY != 'docker'
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
      - name: Install Podman (with apt-get)
        run: ${INPUTS_SUDO} apt-get update && ${INPUTS_SUDO} apt-get install -y podman && ${INPUTS_SUDO} rm -f /etc/containers/registries.conf
        if: inputs.BINARY == 'podman'
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
      - name: Podman debug info
        run: podman version && podman info && podman info --debug
        if: inputs.BINARY == 'podman'
      - name: Add swap for extra memory headroom
        # Detached: mkswap plus ~25G of toolchain deletion costs a minute and
        # nothing downstream needs to block on it. The script picks the largest
        # non-root disk (/mnt on GitHub images) so the swapfile does not eat the
        # root disk that docker and buildkit layers need. Log is dumped by
        # the failure-diagnostics action.
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/add-swap.sh" --detach
      - name: Set Docker default ulimits for Docker 29+ compatibility
        if: inputs.BINARY == 'docker'
        run: |
          for svc in docker containerd; do
            sudo mkdir -p /etc/systemd/system/${svc}.service.d
            printf '[Service]\nLimitNOFILE=1048576\n' | sudo tee /etc/systemd/system/${svc}.service.d/override.conf
          done
          sudo systemctl daemon-reload
          sudo systemctl restart containerd
          sudo systemctl restart docker
      - name: Earth bootstrap
        run: ${INPUTS_SUDO} "$(which earth)" bootstrap
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
      - name: Configure EarthBuild to use GCR mirror
        run: |-
          ${INPUTS_SUDO} "$(which earth)" config global.buildkit_additional_config "'[registry.\"docker.io\"]
          mirrors = [\"mirror.gcr.io\", \"public.ecr.aws\"]'"
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
      # bootstrap AFTER the mirror config above, so the daemon starts with
      # the registry mirror already in place.
      - name: Earthly bootstrap
        run: ${INPUTS_SUDO} "$(which earth)" bootstrap
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ${INPUTS_SUDO} "${INPUTS_BINARY}" login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Update Buildkit to earthly-next
        if: inputs.USE_NEXT
        run: |
          # shellcheck disable=SC2086  # INPUTS_SUDO is "" or "sudo -E": it must word-split
          scripts/ci/earth-retry.sh --binary "$INPUTS_BINARY" --sudo "$INPUTS_SUDO" --sleep 3 --bootstrap "$INPUTS_SUDO $(which earth) bootstrap" \
            -- ${INPUTS_SUDO} "$(which earth)" +update-buildkit --BUILDKIT_GIT_SHA="$(cat earthly-next)"
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Build latest earthly using released earthly
        # Every downstream job depends on this step, so a failure here cascades
        # into skips across the whole run.
        run: |
          # shellcheck disable=SC2086  # INPUTS_SUDO is "" or "sudo -E": it must word-split
          scripts/ci/earth-retry.sh --binary "$INPUTS_BINARY" --sudo "$INPUTS_SUDO" --sleep 3 --bootstrap "$INPUTS_SUDO $(which earth) bootstrap" \
            -- ${INPUTS_SUDO} "$(which earth)" --use-inline-cache --artifact +earthly-linux-amd64/earthly ./build/linux/amd64/earthly
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Configure and bootstrap using latest earth build
        run: |-
          ${INPUTS_SUDO} ./build/linux/amd64/earthly config global.buildkit_additional_config "'[registry.\"docker.io\"]
          mirrors = [\"mirror.gcr.io\", \"public.ecr.aws\"]'"
          ${INPUTS_SUDO} ./build/linux/amd64/earthly bootstrap
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
      - name: Set EARTH_VERSION_FLAG_OVERRIDES env
        run: |-
          set -euo pipefail
          EARTH_VERSION_FLAG_OVERRIDES="$(tr -d '\n' < .earthly_version_flag_overrides)"
          echo "EARTH_VERSION_FLAG_OVERRIDES=$EARTH_VERSION_FLAG_OVERRIDES" >> "$GITHUB_ENV"
      # Computed once: three later steps need it, and it is a pure function of
      # the workflow inputs.
      - name: Set TAG_SUFFIX env
        run: |-
          set -euo pipefail
          suffix="$INPUTS_RUNS_ON"
          if [ "$INPUTS_USE_NEXT" = "true" ]; then suffix="$suffix-ticktock"; fi
          echo "TAG_SUFFIX=$suffix" >> "$GITHUB_ENV"
        env:
          INPUTS_RUNS_ON: ${{inputs.RUNS_ON}}
          INPUTS_USE_NEXT: ${{inputs.USE_NEXT}}
      - name: Build and push +ci-release using latest earth build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          # shellcheck disable=SC2086  # INPUTS_SUDO is "" or "sudo -E": it must word-split
          scripts/ci/earth-retry.sh --binary "$INPUTS_BINARY" --sudo "$INPUTS_SUDO" --sleep 3 --bootstrap "$INPUTS_SUDO ./build/linux/amd64/earthly bootstrap" \
            -- ${INPUTS_SUDO} ./build/linux/amd64/earthly --ci --push --build-arg TAG_SUFFIX +ci-release
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Build +ci-release using latest earth build (fork - no push)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        # Builds the binary and buildkitd, then loads the image locally - no push.
        # Note: earth-retry.sh -c takes a single-quoted snippet, so keep
        # apostrophes out of it. Comments belong here, not in the snippet.
        run: |
          # shellcheck disable=SC2016  # the snippet is passed verbatim to earth-retry.sh, which runs it
          scripts/ci/earth-retry.sh --binary "$INPUTS_BINARY" --sudo "$INPUTS_SUDO" --sleep 3 --bootstrap "$INPUTS_SUDO ./build/linux/amd64/earthly bootstrap" -c '
            ${INPUTS_SUDO} ./build/linux/amd64/earthly --ci --output --build-arg TAG_SUFFIX +ci-release && \
              ${INPUTS_SUDO} ./build/linux/amd64/earthly --ci --image --build-arg TAG="${GITHUB_SHA}-${TAG_SUFFIX}" --build-arg DOCKERHUB_BUILDKIT_IMG=buildkitd-staging ./buildkitd+buildkitd
          '
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Save buildkitd image tarball (all runs)
        # Shipping the buildkitd image as a GHA artifact -- rather than having
        # every downstream test job pull it from ghcr -- moves ~67 in-run image
        # fetches off ghcr and onto in-run artifact storage, which does not
        # rate-limit. Fork PRs already relied on this path; it is now always on.
        #
        # EarthBuild pushes straight from buildkit's internal store to ghcr
        # without tagging the image in the host daemon, so a pull is needed
        # before `save` can find the tag. We pay that pull once here instead of
        # once per test job. On fork PRs the image was built locally via
        # --image in the step above, so `image inspect` hits and no pull runs.
        run: |-
          set -euo pipefail
          export TAG_SUFFIX="latest"
          if [ "${{inputs.USE_NEXT}}" = "true" ]; then export TAG_SUFFIX="$TAG_SUFFIX-ticktock"; fi
          IMG="ghcr.io/earthbuild/earthbuild:buildkitd-staging-${GITHUB_SHA}-${TAG_SUFFIX}"

          mkdir -p ./artifacts
          echo "${TAG_SUFFIX}" > ./artifacts/tag-suffix.txt
          if ! ${INPUTS_SUDO} "${INPUTS_BINARY}" image inspect "$IMG" >/dev/null 2>&1; then
            ${INPUTS_SUDO} "${INPUTS_BINARY}" pull "$IMG"
          fi
          ${INPUTS_SUDO} "${INPUTS_BINARY}" save "$IMG" -o ./artifacts/buildkitd-image.tar
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Build earth binary artifact (fork only)
        # Fork PRs cannot read the earth binary from ghcr, so it ships in the
        # artifact. Non-fork jobs fetch it from ghcr instead -- rebuilding it
        # here would be minutes of redundant work on every run.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |-
          set -euo pipefail
          export TAG_SUFFIX="latest"
          if [ "${{inputs.USE_NEXT}}" = "true" ]; then export TAG_SUFFIX="$TAG_SUFFIX-ticktock"; fi

          # DEFAULT_INSTALLATION_NAME=earthly ensures the buildkitd container
          # is named "earthly-buildkitd" as tests expect.
          ${INPUTS_SUDO} ./build/linux/amd64/earthly --ci --artifact \
            +earthly/earthly \
            --DEFAULT_BUILDKITD_IMAGE="ghcr.io/earthbuild/earthbuild:buildkitd-staging-${GITHUB_SHA}-${TAG_SUFFIX}" \
            --VERSION="0.8.18" \
            --DEFAULT_INSTALLATION_NAME=earthly \
            ./artifacts/earthly
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          # `== true` not bare truthiness: this is a typed boolean here, but a
          # string in stage2-setup's composite action (where the matching
          # download uses `== 'true'`). Truthiness would make the string 'false'
          # append -ticktock and silently break the name match.
          name: earth-build-latest${{ inputs.USE_NEXT == true && '-ticktock' || '' }}
          path: ./artifacts/
          retention-days: 1
      - name: Failure diagnostics
        if: ${{ failure() }}
        uses: ./.github/actions/failure-diagnostics
        with:
          BINARY: "${{ inputs.BINARY }}"
          SUDO: "${{ inputs.SUDO }}"
