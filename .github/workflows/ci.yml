name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/renovate.json5'
      - '.github/CODEOWNERS'
      - 'LICENSE'
  pull_request:
    branches: [ main, get-ci-working ]
  merge_group:


# Workflow-wide floor only; every job narrows or widens this for itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES != '' && format('{0},', vars.OTEL_RESOURCE_ATTRIBUTES) || '' }}${{ github.event.pull_request != null && format('vcs.repository.change.id={0},vcs.repository.change.title={1},', github.event.pull_request.number, github.event.pull_request.title) || '' }}cicd.pipeline.run.id=${{ github.run_number }},cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},cicd.pipeline.name=${{ github.workflow }},vcs.revision.id=${{ github.sha }},vcs.ref.name=${{ github.ref_name }},vcs.repository.name=${{ github.repository }},user.id=${{ github.actor }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

jobs:
  fast-check-and-build:
    name: Fast Check & Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EARTHLY_BUILDKIT_IMAGE: ghcr.io/earthbuild/earthbuild:buildkitd-v0.8.17-fix.1
    steps:
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          # Authenticate the release-list API call so it isn't rate-limited on
          # shared runner IPs (unauthenticated is 60 req/hr/IP).
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Lint
        run: earth --ci +lint-gating
      # Reported, not gating. The Go linter configuration is maximal and the
      # engine work carries a backlog against it; a check expected to be red is
      # one nobody reads, which costs more than the findings. The count is
      # tracked in docs-internals/plan-native-engine.md and comes down there.
      - name: Go lint (report only)
        run: earth --ci +lint
        continue-on-error: true
      - name: Unit tests
        run: earth --ci +unit-test
      # The engine's own tests again, under the race detector and shuffled.
      #
      # Separate from +unit-test because -race needs cgo and everything else
      # here builds with CGO_ENABLED=0, and because the two answer different
      # questions: whether the tests pass, and whether they pass for the reason
      # they claim. It also refuses to be green if more of the suite skipped in
      # the container than it should - a run that verified less is the failure
      # that ceiling exists to catch.
      - name: Engine race and shuffle
        run: earth --ci +engine-race
      # The tests that need a real docker daemon.
      #
      # Behind a build tag, so nothing else runs them, and privileged, because a
      # daemon of a step's own needs a mount namespace with a private /run and a
      # plain container is refused at clone. They are the only tests that
      # exercise what a WITH DOCKER step actually gets, and until now the only
      # ones nothing ran but a person typing the command.
      #
      # The target refuses to be green if fewer than three of them ran: they
      # skip themselves where there is no dockerd, and a target that passes
      # because nothing ran is what that floor exists to catch.
      - name: Engine docker daemon tests
        run: earth --ci --allow-privileged +engine-daemon
      - name: Fuzz tests
        run: earth --ci +fuzz-test

      # --- Build Standard EarthBuild ---
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: "Put back the git branch into git (EarthBuild uses it for tagging)"
        run: |
          branch=""
          if [ -n "$GITHUB_HEAD_REF" ]; then
            branch="$GITHUB_HEAD_REF"
          else
            branch="${GITHUB_REF##*/}"
          fi
          git checkout -b "$branch" || true
      - name: Configure EarthBuild to use GCR mirror
        run: |-
          earth config global.buildkit_additional_config "'[registry.\"docker.io\"]
          mirrors = [\"mirror.gcr.io\", \"public.ecr.aws\"]'"
      - name: Build latest earth using released earth
        run: earth --use-inline-cache +for-linux
      - name: Set EARTHLY_VERSION_FLAG_OVERRIDES env
        run: |-
          set -euo pipefail
          EARTHLY_VERSION_FLAG_OVERRIDES="$(tr -d '\n' < .earthly_version_flag_overrides)"
          echo "EARTHLY_VERSION_FLAG_OVERRIDES=$EARTHLY_VERSION_FLAG_OVERRIDES" >> "$GITHUB_ENV"
      - name: Build and push +ci-release using latest earth build
        if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          export TAG_SUFFIX="latest"
          ./build/linux/amd64/earthly --ci --push --build-arg TAG_SUFFIX +ci-release
      - name: Build +ci-release using latest earth build (fork - no push)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |-
          export TAG_SUFFIX="latest"
          # Build ci-release (builds binary and buildkitd but doesn't push)
          ./build/linux/amd64/earthly --ci --output --build-arg TAG_SUFFIX +ci-release
          # Explicitly output the buildkitd image to local docker daemon
          ./build/linux/amd64/earthly --ci --image --build-arg TAG="${GITHUB_SHA}-${TAG_SUFFIX}" --build-arg DOCKERHUB_BUILDKIT_IMG=buildkitd-staging ./buildkitd+buildkitd
      - name: Save buildkitd image tarball (all runs)
        # Shipping buildkitd as a GHA artifact -- rather than having every
        # downstream test job pull it from ghcr -- moves ~67 in-run image
        # fetches off ghcr and onto in-run artifact storage, which does not
        # rate-limit. Fork PRs already relied on this path; it is now always on,
        # and stage2-setup downloads unconditionally to match.
        #
        # earth pushes straight from buildkit's internal store to ghcr without
        # tagging the image in the host daemon, so a pull is needed before
        # `save` can find the tag. That pull happens once here instead of once
        # per test job. On fork PRs the image was built locally via --image
        # above, so `image inspect` hits and no pull runs.
        run: |-
          set -euo pipefail
          export TAG_SUFFIX="latest"
          IMG="ghcr.io/earthbuild/earthbuild:buildkitd-staging-${GITHUB_SHA}-${TAG_SUFFIX}"

          mkdir -p ./artifacts-standard
          echo "${TAG_SUFFIX}" > ./artifacts-standard/tag-suffix.txt
          if ! docker image inspect "$IMG" >/dev/null 2>&1; then
            docker pull "$IMG"
          fi
          docker save "$IMG" -o ./artifacts-standard/buildkitd-image.tar
      - name: Build earth binary artifact (fork only)
        # Fork PRs cannot read the binary from ghcr, so it ships in the
        # artifact. Non-fork jobs fetch it via `earth upgrade` instead --
        # rebuilding it here would be minutes of redundant work every run.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |-
          set -euo pipefail
          export TAG_SUFFIX="latest"

          # Build earth CLI binary with correct installation name (earthly, not earthly-dev)
          # This ensures the buildkitd container is named "earthly-buildkitd" as tests expect
          ./build/linux/amd64/earthly --ci --artifact \
            +earthly/earthly \
            --DEFAULT_BUILDKITD_IMAGE="ghcr.io/earthbuild/earthbuild:buildkitd-staging-${GITHUB_SHA}-${TAG_SUFFIX}" \
            --VERSION="0.8.18" \
            --DEFAULT_INSTALLATION_NAME=earthly \
            ./artifacts-standard/earthly
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: earth-build-latest
          path: ./artifacts-standard/
          retention-days: 1

      # --- Build Next EarthBuild ---
      - name: Update Buildkit to earthly-next
        run: earth +update-buildkit --BUILDKIT_GIT_SHA="$(cat earthly-next)"
      - name: Build latest earth (next) using released earth
        run: earth --use-inline-cache +for-linux
      - name: Build and push +ci-release (next) using latest earth build
        if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          export TAG_SUFFIX="latest-ticktock"
          ./build/linux/amd64/earthly --ci --push --build-arg TAG_SUFFIX +ci-release
      - name: Build +ci-release (next) using latest earth build (fork - no push)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |-
          export TAG_SUFFIX="latest-ticktock"
          # Build ci-release (builds binary and buildkitd but doesn't push)
          ./build/linux/amd64/earthly --ci --output --build-arg TAG_SUFFIX +ci-release
          # Explicitly output the buildkitd image to local docker daemon
          ./build/linux/amd64/earthly --ci --image --build-arg TAG="${GITHUB_SHA}-${TAG_SUFFIX}" --build-arg DOCKERHUB_BUILDKIT_IMG=buildkitd-staging ./buildkitd+buildkitd
      - name: Save buildkitd image tarball (next, all runs)
        # See the standard-variant step above for why this is unconditional.
        run: |-
          set -euo pipefail
          export TAG_SUFFIX="latest-ticktock"
          IMG="ghcr.io/earthbuild/earthbuild:buildkitd-staging-${GITHUB_SHA}-${TAG_SUFFIX}"

          mkdir -p ./artifacts-next
          echo "${TAG_SUFFIX}" > ./artifacts-next/tag-suffix.txt
          if ! docker image inspect "$IMG" >/dev/null 2>&1; then
            docker pull "$IMG"
          fi
          docker save "$IMG" -o ./artifacts-next/buildkitd-image.tar
      - name: Build earth binary artifact (next, fork only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |-
          set -euo pipefail
          export TAG_SUFFIX="latest-ticktock"

          # Build earth CLI binary with correct installation name (earthly, not earthly-dev)
          # This ensures the buildkitd container is named "earthly-buildkitd" as tests expect
          ./build/linux/amd64/earthly --ci --artifact \
            +earthly/earthly \
            --DEFAULT_BUILDKITD_IMAGE="ghcr.io/earthbuild/earthbuild:buildkitd-staging-${GITHUB_SHA}-${TAG_SUFFIX}" \
            --VERSION="0.8.18" \
            --DEFAULT_INSTALLATION_NAME=earthly \
            ./artifacts-next/earthly
      - name: Upload artifacts (next)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: earth-build-latest-ticktock
          path: ./artifacts-next/
          retention-days: 1

  # --- Docker Suite ---
  docker-tests:
    name: Docker
    needs: fast-check-and-build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-test-suite.yml
    with:
      FRONTEND: "docker"
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  docker-examples:
    name: Docker Examples
    needs: fast-check-and-build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-examples-suite.yml
    with:
      FRONTEND: "docker"
    secrets:
      DOCKERHUB_MIRROR_PASSWORD: ${{ secrets.DOCKERHUB_MIRROR_PASSWORD }}
      DOCKERHUB_MIRROR_USERNAME: ${{ secrets.DOCKERHUB_MIRROR_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  docker-integrations:
    name: Docker Integrations
    needs: fast-check-and-build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-integration-suite.yml
    with:
      FRONTEND: "docker"
    secrets:
      DOCKERHUB_MIRROR_PASSWORD: ${{ secrets.DOCKERHUB_MIRROR_PASSWORD }}
      DOCKERHUB_MIRROR_USERNAME: ${{ secrets.DOCKERHUB_MIRROR_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  # --- Podman Suite ---
  podman-tests:
    name: Podman
    needs: fast-check-and-build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-test-suite.yml
    with:
      FRONTEND: "podman"
      SUDO: "sudo -E"
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  podman-examples:
    name: Podman Examples
    needs: fast-check-and-build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-examples-suite.yml
    with:
      FRONTEND: "podman"
      SUDO: "sudo -E"
    secrets:
      DOCKERHUB_MIRROR_PASSWORD: ${{ secrets.DOCKERHUB_MIRROR_PASSWORD }}
      DOCKERHUB_MIRROR_USERNAME: ${{ secrets.DOCKERHUB_MIRROR_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  # --- Next Suite ---
  next-tests:
    name: Next
    needs: fast-check-and-build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-test-suite.yml
    with:
      FRONTEND: "docker"
      USE_NEXT: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  # --- Merge Gate ---
  # The ONLY check that branch protection should require. Every other job's
  # context name is free to churn (renamed suites, re-grouped tests, new
  # frontends) without an admin having to re-point the ruleset - a mismatch
  # there leaves a PR waiting forever on a context nothing will ever report.
  # Add new suites to `needs` and they are gated automatically.
  # What the native engine does on a machine nobody developed it on.
  #
  # It has been built against one darwin arm64 laptop; this is linux on amd64,
  # with a different sandbox and a different filesystem, which is the set of
  # assumptions a single developer's machine cannot test (E593).
  #
  # **Not a gate.** `continue-on-error` and absent from `ci-success` on purpose:
  # the native engine is not what this repository ships, and a job that reports
  # is worth having long before one that blocks. It turns red into a comment on
  # a pull request rather than a merge nobody can complete.
  native-engine:
    name: Native engine (report only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both binaries
        run: |-
          set -euo pipefail
          go build -o /tmp/earth ./cmd/earth
          go build -o /tmp/earth-guestd ./cmd/earth-guestd
      - name: What this platform can do
        run: |-
          set -euo pipefail
          uname -srm
          # Every combination the release ships, so a package that cannot be
          # built for one of them fails here rather than in a release (E581).
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            printf '%-16s ' "$pair"
            GOOS="${pair%%/*}" GOARCH="${pair##*/}" go build ./... && echo ok
          done
      - name: What this kernel permits
        # Asked rather than assumed. The first run here failed to mount an
        # overlay and to mount a procfs, and the obvious explanation - Ubuntu
        # 24.04 restricting unprivileged user namespaces - is a guess until the
        # machine is asked (E595).
        run: |-
          set -euo pipefail
          for k in kernel.apparmor_restrict_unprivileged_userns \
                   kernel.unprivileged_userns_clone \
                   user.max_user_namespaces; do
            printf '%-48s ' "$k"
            sysctl -n "$k" 2>/dev/null || echo "(not set)"
          done
          printf '%-48s ' "unshare -Urm true"
          unshare -Urm true 2>&1 && echo ok || true
          printf '%-48s ' "overlay in /proc/filesystems"
          grep -c overlay /proc/filesystems || true

      - name: Let unprivileged user namespaces work
        # The measurement above says which line to change:
        # `kernel.apparmor_restrict_unprivileged_userns=1` and `unshare -Urm`
        # denied, while overlay is in /proc/filesystems and there are 63,882
        # namespaces to be had. So the kernel can do it and AppArmor is refusing
        # (E596).
        #
        # A runner is disposable and this is one line of it; a user's machine is
        # not, which is why this belongs here rather than in the engine. What it
        # buys is the rest of the run: without it every RUN fails at the mount
        # and this job reports one fact repeatedly.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build a target with the native engine
        # Report, do not gate: this is the first time it has run here.
        continue-on-error: true
        env:
          EARTH_GUESTD: /tmp/earth-guestd
        run: |-
          set -euo pipefail
          /tmp/earth build --engine=native +earthly 2>&1 | tail -40

      - name: Run this repository's tests under the native engine
        # **The question darwin cannot answer.** Two packages hang under the
        # engine on the laptop it was written on - `engine/interp` for the full
        # `go test -timeout 5m`, `engine/trace` until its tests learned to skip -
        # and every candidate cause was eliminated except the machine itself
        # (E589, E592). Here there is no hypervisor between the step and the
        # disk, so a hang that survives is the engine's and one that does not
        # was the VM's.
        #
        # Timed, and bounded: a hang that reports is worth having and a job that
        # sits for six hours is not.
        continue-on-error: true
        timeout-minutes: 25
        env:
          EARTH_GUESTD: /tmp/earth-guestd
          # Its own store. Three runs sharing one cache is three different
          # questions: the first pays for the base and the rest do not, and the
          # difference between them gets read as the difference being measured
          # (E600).
          EARTH_CACHE_DIR: /tmp/store-watched
        run: |-
          set -euo pipefail
          start=$(date +%s)
          # Timed by phase, because 1.8x against buildkit (E599) is a real number
          # and the next question is which part of it. Kept whole and summarised
          # rather than tailed: a phase list is the one output where the
          # interesting line is never the last one.
          EARTH_TIMINGS=1 /tmp/earth build --engine=native +unit-test > /tmp/native.log 2>&1 || true
          echo "native +unit-test took $(( $(date +%s) - start ))s"

          # **Loud when the suite failed.** This step ran for a fortnight
          # printing a duration and a cache line for a build whose tests were
          # failing, because `|| true` swallowed the status and nothing read the
          # log for `FAIL`. Three real failures hid behind it - a walk of the
          # source tree racing a fixture another package generates - and they
          # were found by running the same build by hand (E616). Report-only is
          # about not blocking the merge, not about not saying.
          if grep -qE '^\s+--- FAIL|test\(s\) failed' /tmp/native.log; then
            echo "::error::the native engine's +unit-test had failing tests"
            # **Before the FAIL line, not after.** Go prints a failing test's own
            # output above its `--- FAIL`, so a grep with only `-A` shows the
            # next test and never the reason (E624).
            grep -E -B 6 '^\s+--- FAIL' /tmp/native.log | head -60
            grep -E 'FAIL\s+github' /tmp/native.log | sort -u | head -20
          fi
          # A build that died before its tests produces neither a cache summary
          # nor a FAIL, and used to report only a duration (E611, E616).
          grep -E '^\s+cache ' /tmp/native.log \
            || echo "::error::the native +unit-test produced no cache summary - it did not run"
          tail -20 /tmp/native.log
          echo "--- where the engine spent its time:"
          grep -oE '^earth: [a-z:]+ +[0-9]+\.[0-9]+s' /tmp/native.log \
            | awk '{s[$2]+=$3; n[$2]++} END {for (k in s) printf "%9.2fs %5d  %s\n", s[k], n[k], k}' \
            | sort -rn | head -12

      - name: The same target, unwatched
        # The phase list says the engine's own work is 2.3s of 335 - scheduling,
        # materialising, capturing and planning together - and the rest is the
        # step running. So what is left to explain is inside the sandbox, and
        # the one thing this sandbox does that buildkit's does not is watch every
        # system call.
        #
        # Measured with it off rather than reasoned about, which is the whole of
        # what E589 taught: a mechanism's cost in a benchmark says nothing about
        # its cost in a workload.
        continue-on-error: true
        timeout-minutes: 25
        env:
          EARTH_GUESTD: /tmp/earth-guestd
          EARTH_TRACE: "0"
          EARTH_CACHE_DIR: /tmp/store-unwatched
        run: |-
          set -euo pipefail
          start=$(date +%s)
          /tmp/earth build --engine=native +unit-test > /tmp/untraced.log 2>&1 || true

          if grep -qE '^\s+--- FAIL|test\(s\) failed' /tmp/untraced.log; then
            echo "::error::the unwatched native +unit-test had failing tests"
            # **Before the FAIL line, not after.** Go prints a failing test's own
            # output above its `--- FAIL`, so a grep with only `-A` shows the
            # next test and never the reason (E624).
            grep -E -B 6 '^\s+--- FAIL' /tmp/untraced.log | head -60
            grep -E 'FAIL\s+github' /tmp/untraced.log | sort -u | head -20
          fi
          echo "native +unit-test unwatched took $(( $(date +%s) - start ))s"
          grep -E '^\s+cache ' /tmp/untraced.log \
            || echo "::error::the unwatched +unit-test produced no cache summary - it did not run"
          tail -6 /tmp/untraced.log

      - name: What the second cache tier is worth
        # **The other half of E601's price.** Watching costs eighty per cent on a
        # target that caches nothing, which is its worst case; what it buys is
        # the tier that lets a step be reused over a base it was not computed on.
        # That has never been measured, so the eighty per cent has been quoted
        # without the thing it is paid for.
        #
        # The case is the ordinary one: change a file most steps never read.
        # Every layer below it moves, so Κ₁ misses everywhere - and a step that
        # did not read the file should still hit on what it observed. Watched
        # against unwatched on that rebuild is what the tier is worth.
        continue-on-error: true
        timeout-minutes: 25
        env:
          EARTH_GUESTD: /tmp/earth-guestd
        run: |-
          set -euo pipefail
          for mode in watched unwatched; do
            store=/tmp/store-l2-$mode
            trace=1; [ "$mode" = unwatched ] && trace=0
            git checkout -- docs-internals/README.md 2>/dev/null || true
            EARTH_CACHE_DIR=$store EARTH_TRACE=$trace \
              /tmp/earth build --engine=native +earthly > /dev/null 2>&1 || true
            # A file the Go build never opens, so its layer moves and the
            # compile's own inputs do not.
            echo "<!-- $(date +%s%N) -->" >> docs-internals/README.md
            start=$(date +%s)
            EARTH_CACHE_DIR=$store EARTH_TRACE=$trace \
              /tmp/earth build --engine=native +earthly > /tmp/l2-$mode.log 2>&1 || true
            echo "$mode rebuild after an unread file changed: $(( $(date +%s) - start ))s"
            if ! grep -E '^\s+cache ' /tmp/l2-$mode.log; then
              echo "::error::the $mode L2 case produced no cache summary - it did not run"
              tail -30 /tmp/l2-$mode.log
            fi
          done
          git checkout -- docs-internals/README.md 2>/dev/null || true

      - name: What the second cache tier is worth, with a base that moves
        # E602 changed a file copied late, so almost nothing sat below it:
        # sixty-nine L1 hits and no work for the second tier to do. This builds
        # the case K2 exists for instead - a base that genuinely differs, and a
        # step that reads none of what differs.
        #
        # **The first three versions of this step measured nothing and said so
        # in seconds** (E611): `base` is a reserved target name so the Earthfile
        # never parsed, `--build-arg` was dropped by the native engine, and
        # declaring an ARG on the target defeats the tier outright by splitting
        # the step's profile class. Hence no ARG here and two literal
        # Earthfiles - the base differs because the base differs.
        #
        # Categorical rather than extrapolated: what is read off this is whether
        # the step hits, not a duration to scale up. That distinction is what
        # four benchmarks in this file got wrong (E589).
        continue-on-error: true
        timeout-minutes: 20
        env:
          EARTH_GUESTD: /tmp/earth-guestd
        run: |-
          set -euo pipefail
          mkdir -p /tmp/l2case && cd /tmp/l2case

          mk() {
            cat > Earthfile <<EOF
          VERSION 0.8

          bottom:
              FROM alpine:3.24.1
              # Two files: one that differs between builds, one that does not.
              RUN echo "$1" > /salt && echo constant > /needed

          work:
              FROM +bottom
              # Reads /needed and never /salt, so its observation is the same
              # over either base - which is the whole of what K2 claims. The
              # sleep is the thing a hit is supposed to skip.
              RUN cat /needed > /out && sleep 20
          EOF
          }

          for mode in watched unwatched; do
            trace=1; [ "$mode" = unwatched ] && trace=0
            store=/tmp/store-l2b-$mode

            mk one
            EARTH_CACHE_DIR=$store EARTH_TRACE=$trace \
              /tmp/earth build --engine=native +work > /tmp/l2b-$mode-first.log 2>&1 || true

            mk two
            start=$(date +%s)
            EARTH_CACHE_DIR=$store EARTH_TRACE=$trace \
              /tmp/earth build --engine=native +work > /tmp/l2b-$mode.log 2>&1 || true
            echo "$mode, base changed underneath: $(( $(date +%s) - start ))s"

            # **Loud when it did not run.** Every earlier version of this step
            # printed a plausible duration for a build that had failed to parse,
            # because `|| true` swallowed the error and the grep below printed
            # nothing. A measurement that cannot fail is not a measurement.
            if ! grep -E '^\s+cache ' /tmp/l2b-$mode.log; then
              echo "::error::the $mode L2 case produced no cache summary - it did not run"
              tail -30 /tmp/l2b-$mode-first.log
              tail -30 /tmp/l2b-$mode.log
            fi
          done

      - name: The same target through buildkit, on the same machine
        # **The comparison every number so far has been missing.** 301s against
        # earthly's 147s compared two machines: a hosted runner and a laptop
        # with a hypervisor in it. One binary, one runner, one target and two
        # engines is the only arrangement in which the difference is the engine
        # (E598).
        #
        # Its own bootstrap, so the clock includes starting buildkitd - which is
        # a cost the native engine does not have and should not be hidden.
        continue-on-error: true
        timeout-minutes: 30
        env:
          # A binary built from this branch names a buildkitd image that was
          # never published for it, so it reaches for
          # `buildkitd-dev-giles-post-buildkit-engine` and docker says "manifest
          # unknown". The same pin `fast-check-and-build` uses.
          #
          # Worth noticing rather than only fixing: the native engine needed no
          # image, no daemon and no registry to run three steps earlier in this
          # job.
          EARTHLY_BUILDKIT_IMAGE: ghcr.io/earthbuild/earthbuild:buildkitd-v0.8.17-fix.1
        run: |-
          set -euo pipefail
          start=$(date +%s)
          /tmp/earth build --engine=buildkit +unit-test 2>&1 | tail -30 || true
          echo "buildkit +unit-test took $(( $(date +%s) - start ))s"

  ci-success:
    name: CI Success
    if: always()
    needs:
      - fast-check-and-build
      - docker-tests
      - docker-examples
      - docker-integrations
      - podman-tests
      - podman-examples
      - next-tests
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check suite results
        env:
          # Anything other than success - failure, cancelled, or skipped
          # (a suite is skipped only when something it needed failed) - is a
          # red gate.
          NEEDS: ${{ toJSON(needs) }}
        run: |-
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$NEEDS" | sort
          if jq -e 'any(.[]; .result != "success")' >/dev/null <<< "$NEEDS"; then
            echo "::error::One or more CI suites did not succeed"
            exit 1
          fi
          echo "All CI suites succeeded"
