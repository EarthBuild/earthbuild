name: Misc Tests 2

on:
  workflow_call:
    inputs:
      BUILT_EARTH_PATH:
        required: true
        type: string
      BINARY:
        required: true
        type: string
      SUDO:
        type: string
        required: false
      RUNS_ON:
        required: true
        type: string
      SKIP_JOB:
        required: false
        type: boolean
        default: false
      USE_SATELLITE:
        required: false
        type: boolean
        default: false
      SATELLITE_NAME:
        required: false
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false


env:
  OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES != '' && format('{0},', vars.OTEL_RESOURCE_ATTRIBUTES) || '' }}${{ github.event.pull_request != null && format('vcs.repository.change.id={0},vcs.repository.change.title={1},', github.event.pull_request.number, github.event.pull_request.title) || '' }}cicd.pipeline.run.id=${{ github.run_number }},cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},cicd.pipeline.name=${{ github.workflow }},vcs.revision.id=${{ github.sha }},vcs.ref.name=${{ github.ref_name }},vcs.repository.name=${{ github.repository }},user.id=${{ github.actor }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

jobs:
  misc-tests-2:
    if: ${{!inputs.SKIP_JOB}}
    runs-on: ${{inputs.RUNS_ON}}
    permissions:
      contents: read
      packages: read
    env:
      FORCE_COLOR: 1
      # Used in our github action as the token - TODO: look to change it into an input
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/stage2-setup
        with:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          BUILT_EARTH_PATH: "${{ inputs.BUILT_EARTH_PATH }}"
          BINARY: "${{ inputs.BINARY }}"
          SUDO: "${{ inputs.SUDO }}"
      - name: Set EARTH_VERSION_FLAG_OVERRIDES env
        run: |-
          set -euo pipefail
          EARTH_VERSION_FLAG_OVERRIDES="$(tr -d '\n' < .earthly_version_flag_overrides)"
          echo "EARTH_VERSION_FLAG_OVERRIDES=$EARTH_VERSION_FLAG_OVERRIDES" >> "$GITHUB_ENV"
      - name: Run linux-amd64 specific tests
        run: |
          # shellcheck disable=SC2086  # INPUTS_SUDO is "" or "sudo -E": it must word-split
          scripts/ci/earth-retry.sh --binary "$INPUTS_BINARY" --sudo "$INPUTS_SUDO" \
            -- ${INPUTS_SUDO} "${INPUTS_BUILT_EARTH_PATH}" --ci -P ./tests+ga-linux-amd64
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
          INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
      - name: Execute earthly ${{inputs.BINARY}} command
        run: (cd tests/docker && ${INPUTS_SUDO} "../../${INPUTS_BUILT_EARTH_PATH}" docker-build --tag examples-test-docker:latest . && diff <(docker run --rm examples-test-docker:latest) <(echo "hello dockerfile") )
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
      - name: Execute private image test (Earthly Only) # TODO move to separate workflow
        run: ${INPUTS_SUDO} "${INPUTS_BUILT_EARTH_PATH}" --ci ./tests+private-image-test
        if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
      - name: Execute save images test
        run: frontend="${INPUTS_BINARY}" ./tests/save-images/test.sh
        env:
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Experimental tests
        run: |
          # shellcheck disable=SC2086  # INPUTS_SUDO is "" or "sudo -E": it must word-split
          scripts/ci/earth-retry.sh --binary "$INPUTS_BINARY" --sudo "$INPUTS_SUDO" \
            -- ${INPUTS_SUDO} "${INPUTS_BUILT_EARTH_PATH}" --ci -P ./tests+experimental
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
          INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
      - name: Test buildkit info-level logging
        run: ${INPUTS_SUDO} "${INPUTS_BINARY}" logs earthly-buildkitd 2>&1 | grep 'running server on'
        env:
          INPUTS_SUDO: ${{inputs.SUDO}}
          INPUTS_BINARY: ${{inputs.BINARY}}
      - name: Failure diagnostics
        if: ${{ failure() }}
        uses: ./.github/actions/failure-diagnostics
        with:
          BINARY: "${{ inputs.BINARY }}"
          SUDO: "${{ inputs.SUDO }}"
