name: Frontend Suite

on:
  workflow_call:
    inputs:
      FRONTEND:
        required: true
        type: string
      SUDO:
        required: false
        type: string
        default: ""
      USE_NEXT:
        required: false
        type: boolean
        default: false
      RUN_INTEGRATION_TESTS:
        required: false
        type: boolean
        default: false
      RUN_EXAMPLES:
        required: false
        type: boolean
        default: true
      RUN_QEMU:
        required: false
        type: boolean
        default: true

env:
  OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES != '' && format('{0},', vars.OTEL_RESOURCE_ATTRIBUTES) || '' }}${{ github.event.pull_request != null && format('vcs.repository.change.id={0},vcs.repository.change.title={1},', github.event.pull_request.number, github.event.pull_request.title) || '' }}cicd.pipeline.run.id=${{ github.run_number }},cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},cicd.pipeline.name=${{ github.workflow }},vcs.revision.id=${{ github.sha }},vcs.ref.name=${{ github.ref_name }},vcs.repository.name=${{ github.repository }},user.id=${{ github.actor }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

jobs:
  bootstrap-test:
    name: Bootstrap Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/stage2-setup
        with:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
          BINARY: "${{ inputs.FRONTEND }}"
          SUDO: "${{ inputs.SUDO }}"
      - name: Run earth bootstrap
        run: ${{ inputs.SUDO }} ./build/linux/amd64/earthly bootstrap

  tests:
    name: ${{ matrix.name }}
    needs: bootstrap-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "+test-misc"
            name: "Misc (AST & Parser)"
          - target: "+test-no-qemu-group1"
            name: "Group 1 (Autocompletion, Dockerfile & Imports)"
          - target: "+test-no-qemu-group2"
            name: "Group 2 (COPY & Git Clone Operations)"
          - target: "+test-no-qemu-group3"
            name: "Group 3 (Secrets, Build ARGs & Host Bind)"
          - target: "+test-no-qemu-group4"
            name: "Group 4 (Dockerfile, Artifact Saves & Env)"
          - target: "+test-no-qemu-group5"
            name: "Group 5 (Control Flow, Cache Mounts & AWS)"
          - target: "+test-no-qemu-group6"
            name: "Group 6 (Cache & Credential Scrubbing)"
          - target: "+test-no-qemu-group7"
            name: "Group 7 (Selective Save, Compose & Dotenv)"
          - target: "+test-no-qemu-group8"
            name: "Group 8 (Docker Registry & SSH Config)"
          - target: "+test-no-qemu-group9"
            name: "Group 9 (Config & ARG Redeclare Validation)"
          - target: "+test-no-qemu-group10"
            name: "Group 10 (SSH & Remote Resolution)"
          - target: "+test-no-qemu-group11"
            name: "Group 11 (Expose, Artifacts & Logbus)"
          - target: "+test-no-qemu-group12"
            name: "Group 12 (Label Validation & Run Cache)"
          - target: "+test-no-qemu-slow"
            name: "Slow (Server Daemon & WITH DOCKER)"
    uses: ./.github/workflows/reusable-test.yml
    with:
      TEST_TARGET: ${{ matrix.target }}
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      USE_NEXT: ${{ inputs.USE_NEXT }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  tests-qemu:
    name: QEMU Multi-Arch Tests
    needs: bootstrap-test
    if: ${{ inputs.RUN_QEMU }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      TEST_TARGET: "+test-qemu"
      USE_QEMU: true
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      USE_NEXT: ${{ inputs.USE_NEXT }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  examples:
    name: ${{ matrix.name }}
    needs: bootstrap-test
    if: ${{ inputs.RUN_EXAMPLES }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: "+examples-1"
            name: "Examples 1 (C, C++, Go, Elixir, Multi-repo)"
          - example: "+examples-2"
            name: "Examples 2 (Ruby, Rust, Scala, Multi-platform)"
          - example: "+examples-3"
            name: "Examples 3 (Python, Bazel, MkDocs, Zig)"
          - example: "+examples-4"
            name: "Examples 4 (gRPC)"
          - example: "+examples-5"
            name: "Examples 5 (Java, JS & Node)"
    uses: ./.github/workflows/reusable-example.yml
    with:
      EXAMPLE_NAME: ${{ matrix.example }}
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      USE_QEMU: ${{ inputs.FRONTEND == 'podman' }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  test-local:
    name: Test Local
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-test-local.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      BINARY_COMPOSE: "\"docker compose\""
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  push-integrations:
    name: Push Integrations
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-push-integrations.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  bootstrap-integrations:
    name: Bootstrap Integrations
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-bootstrap-integrations.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  repo-auth-tests:
    name: Repo Auth Tests
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-repo-auth-tests.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  export-test:
    name: Export Test
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-export-test.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  docker-build-integrations:
    name: Docker Build Integrations
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-docker-build-integrations.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  earthbuild-image-test:
    name: EarthBuild Image Test
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-earthbuild-image-tests.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  misc-test-1:
    name: Misc Test 1
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-misc-tests-1.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  misc-test-2:
    name: Misc Test 2
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-misc-tests-2.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  wait-block-main:
    name: Wait Block Main
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-wait-block-main.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  wait-block-targets:
    name: ${{ matrix.name }}
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "+test-misc"
            name: "Wait Block (Misc)"
          - target: "+test-no-qemu-group1"
            name: "Wait Block (Group 1)"
          - target: "+test-no-qemu-group2"
            name: "Wait Block (Group 2)"
          - target: "+test-no-qemu-group3"
            name: "Wait Block (Group 3)"
          - target: "+test-no-qemu-group4"
            name: "Wait Block (Group 4)"
          - target: "+test-no-qemu-slow"
            name: "Wait Block (Slow)"
          - target: "+test-qemu"
            name: "Wait Block (QEMU)"
    uses: ./.github/workflows/reusable-wait-block-target.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
      TARGET_NAME: ${{ matrix.target }}
    secrets: inherit

  git-metadata-test:
    name: Git Metadata Test
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    uses: ./.github/workflows/reusable-git-metadata-test.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      RUNS_ON: "ubuntu-24.04"
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit

  race-tests:
    name: ${{ matrix.name }}
    needs: bootstrap-test
    if: ${{ inputs.RUN_INTEGRATION_TESTS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "+test-misc"
            name: "Race Tests (Misc)"
          - target: "+test-no-qemu-group1"
            name: "Race Tests (Group 1)"
          - target: "+test-no-qemu-group2"
            name: "Race Tests (Group 2)"
          - target: "+test-no-qemu-group3"
            name: "Race Tests (Group 3)"
          - target: "+test-no-qemu-group4"
            name: "Race Tests (Group 4)"
          - target: "+test-no-qemu-slow"
            name: "Race Tests (Slow)"
    uses: ./.github/workflows/reusable-race-test.yml
    with:
      BUILT_EARTH_PATH: "./build/linux/amd64/earthly"
      TEST_TARGET: ${{ matrix.target }}
      RUNS_ON: "ubuntu-24.04"
      USE_QEMU: false
      BINARY: ${{ inputs.FRONTEND }}
      SUDO: ${{ inputs.SUDO }}
    secrets: inherit
