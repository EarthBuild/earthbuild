version: "2"
run:
  timeout: 10m
  tests: true
  # build-tags:
  #   - windows
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dogsled
    - dupl
    - dupword
    - err113
    - errcheck
    - errchkjson
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godox
    - gomoddirectives
    - gomodguard # deprecated
    - inamedparam
    - interfacebloat
    - ireturn
    - maintidx
    - mirror
    - mnd
    - musttag
    - nilnesserr
    - nilnil
    - nlreturn
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl # deprecated
    # Renamed, not removed: golangci-lint v2 calls the same linter wsl_v5, so
    # the line above stopped disabling anything and `default: all` switched it
    # back on. It reported two files nobody had touched since #609, and the
    # tool gives no warning that a disabled name no longer exists. Disabling
    # both keeps the decision the line above was making.
    - wsl_v5
  exclusions:
    generated: lax
    rules:
      # `tools/mutate/catalogue.go` is a data table: one entry per deliberate
      # defect, naming the file it belongs to, the package that should notice
      # it, and the snippet it replaces. Its repetition *is* its content -
      # 164 mutants live in `./engine/fleet/`, and that string appearing 164
      # times is the catalogue saying so.
      #
      # Extracting sixty-five constants would put a layer of names between a
      # reader and a table whose whole value is being read literally against
      # the source it mutates. `TestEveryAnchorStillMatchesItsSource` is what
      # keeps the strings honest, and it checks the thing a constant would be
      # hiding.
      - path: tools/mutate/catalogue\.go
        linters:
          - goconst
      # `goconst` in a test reports the fixture vocabulary. The strings it names
      # here are `make` (32 occurrences), `FROM`, `COPY`, `BUILD`, `+main`,
      # `peer` - Earthfile keywords and the words the fixtures are built from,
      # three to five characters each. In a test that literal *is* the
      # specification: `const make = "make"` puts a name in front of the thing
      # being specified and a reader then has to look it up to know what the
      # test says.
      #
      # Where a repeated string in a test is long or semantic - an explanation
      # given nine times, a path - naming it is worth doing and has been done
      # (see `setByDriver` in docs-internals/check). This excludes the noise,
      # not the judgement.
      #
      # Production is not excluded: those nine findings are fixed, and `http`
      # against `https` is exactly the case where one character decides whether
      # a credential goes out in clear.
      - path: _test\.go
        linters:
          - goconst
      # **Excluded because the reason is the same everywhere, which is the test
      # for whether a rule belongs in this file at all.**
      #
      # `goconst` above earns its place the same way. Where a reason differs per
      # site it belongs on the line - the two production G304s each carry their
      # own, because one is a store path this engine derived and the other is a
      # mount target the guest chose, and those are different sentences.
      #
      # These four say the same sentence every time they fire in a test: the
      # path, the argv, the discarded error and the walk callback all come from
      # `t.TempDir()` or from this repository's own tree, because **a test binary
      # has no untrusted input**. Fifty-odd copies of one sentence is not
      # documentation, and the cost of writing them was demonstrated when a
      # blanket exclusion orphaned fifty-two `goconst` directives that had been
      # written one at a time.
      #
      # Deliberately not the whole of `gosec`: G301 and G306 are file modes, and
      # a mode in a test is sometimes a fixture and sometimes a value mirroring
      # what a shell writes. Excluding those would have hidden E632.
      - path: _test\.go
        text: "(G304|G204|G104|G122):"
        linters:
          - gosec
  settings:
    govet:
      enable-all: true
      disable:
        # **Measured before disabling, which is why it is disabled.**
        # `fieldalignment` reported 207 findings: 91 in tests, where field order
        # is a table's column order, and 116 in production. Those 116 are two
        # different claims - 17 that a struct is larger than it needs to be, and
        # 99 that the collector scans further than it needs to - and both are
        # worth something only in proportion to how often the type is allocated.
        #
        # So the types were counted rather than argued about. Two are allocated
        # in volume: `layer.entry`, one per file in a layer, and `store.linkJob`,
        # one per entry placed. Both were reordered by hand and now carry tests
        # asserting `unsafe.Sizeof`, because there the arithmetic is real - eight
        # bytes a hundred thousand times on a real base, and a size class in the
        # second case.
        #
        # The rest are singletons or near enough: `Executor`, `Server`, `Plan`
        # and `engine` are one per build; `ir.Op` is one per graph node, and a
        # large corpus graph is hundreds of nodes, so its sixteen bytes is tens
        # of kilobytes. Against that, these are the types this engine documents
        # most heavily and whose field order groups things a reader needs
        # together.
        #
        # An unmeasured win against a certain cost is not a trade worth taking,
        # and the two places it *was* worth taking are done.
        - fieldalignment
formatters:
  enable:
    - gofumpt
