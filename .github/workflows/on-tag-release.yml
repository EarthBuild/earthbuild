name: Tagged Release

on:
    release:
        types: [published]

env:
  OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES != '' && format('{0},', vars.OTEL_RESOURCE_ATTRIBUTES) || '' }}${{ github.event.pull_request != null && format('vcs.repository.change.id={0},vcs.repository.change.title={1},', github.event.pull_request.number, github.event.pull_request.title) || '' }}cicd.pipeline.run.id=${{ github.run_number }},cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},cicd.pipeline.name=${{ github.workflow }},vcs.revision.id=${{ github.sha }},vcs.ref.name=${{ github.ref_name }},vcs.repository.name=${{ github.repository }},user.id=${{ github.actor }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

jobs:
    add-artifacts-to-release:
        runs-on: ubuntu-26.04-arm
        permissions:
            contents: write
            actions: read
        env:
            FORCE_COLOR: 1
            EARTH_BUILDKIT_IMAGE: ghcr.io/earthbuild/earthbuild:buildkitd-v0.8.17-fix.1
        steps:
            - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
              with:
                  # Authenticate the release-list API call so it isn't rate-limited
                  # on shared runner IPs (unauthenticated is 60 req/hr/IP).
                  github-token: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Copy pre-built artifacts to release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  earth --ci --push --secret GITHUB_TOKEN="${GITHUB_TOKEN}" ./release+promote-artifacts-to-gh \
                      --RELEASE_TAG="${RELEASE_TAG}"
    release-images-to-dockerhub:
        runs-on: ubuntu-26.04-arm
        permissions:
            contents: read
            packages: read
        env:
            FORCE_COLOR: 1
            EARTH_BUILDKIT_IMAGE: ghcr.io/earthbuild/earthbuild:buildkitd-v0.8.17-fix.1
        steps:
            - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
              with:
                  # Authenticate the release-list API call so it isn't rate-limited
                  # on shared runner IPs (unauthenticated is 60 req/hr/IP).
                  github-token: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Copy images from GHCR.io to DockerHub
              env:
                  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

                  GHCR_USERNAME: ${{ github.actor }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  PRERELEASE: ${{ github.event.release.prerelease }}
                  GH_REPO: ${{ github.repository }}
              # TODO: set usernames for docker
              run: |
                  # Only move the floating :latest tags when this release is the
                  # repository's latest release: never for prereleases, and not
                  # for a patch release published for an older line (#769).
                  PUSH_LATEST_TAG=false
                  if [ "${PRERELEASE}" != "true" ]; then
                      # Fail-safe: if the lookup fails, skip moving :latest but
                      # still promote the :<RELEASE_TAG> images below.
                      if LATEST_RELEASE_TAG="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"; then
                          if [ "${LATEST_RELEASE_TAG}" = "${RELEASE_TAG}" ]; then
                              PUSH_LATEST_TAG=true
                          fi
                      else
                          echo "::warning::Could not look up the latest release of ${GH_REPO}; not moving the :latest tags."
                      fi
                  fi
                  echo "Pushing :latest tags: ${PUSH_LATEST_TAG}"
                  earth --ci --push --secret "CONTAINER_REGISTRY_TOKEN=${GITHUB_TOKEN}" \
                      --secret "DEST_CONTAINER_REGISTRY_TOKEN=${DOCKERHUB_TOKEN}" \
                      ./release+promote-to-dockerhub \
                      --RELEASE_TAG="${RELEASE_TAG}" \
                      --PUSH_LATEST_TAG="${PUSH_LATEST_TAG}" \
                      --CONTAINER_REGISTRY_USER="${GHCR_USERNAME}" \
                      --DST_CONTAINER_REGISTRY_USER="${DOCKERHUB_USERNAME}"
