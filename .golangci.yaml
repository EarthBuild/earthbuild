version: "2"
run:
  timeout: 10m
  tests: true
  # build-tags:
  #   - windows
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dogsled
    - dupl
    - dupword
    - err113
    - errcheck
    - errchkjson
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godox
    - gomoddirectives
    - gomodguard # deprecated
    - inamedparam
    - interfacebloat
    - ireturn
    - maintidx
    - mirror
    - mnd
    - musttag
    - nilnesserr
    - nilnil
    - nlreturn
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl # deprecated
    # Renamed, not removed: golangci-lint v2 calls the same linter wsl_v5, so
    # the line above stopped disabling anything and `default: all` switched it
    # back on. It reported two files nobody had touched since #609, and the
    # tool gives no warning that a disabled name no longer exists. Disabling
    # both keeps the decision the line above was making.
    - wsl_v5
  exclusions:
    generated: lax
  settings:
    govet:
      enable-all: true
formatters:
  enable:
    - gofumpt
