// A minimal transcription of the REAPI messages this engine emits.
//
// Field numbers and types are copied from
// build/bazel/remote/execution/v2/remote_execution.proto, so protoc's encoding
// of this is byte-identical to its encoding of the real thing for any message
// using only these fields. Transcribed rather than vendored to avoid REAPI's
// import chain (google/api, google/longrunning, google/rpc), none of which the
// Directory messages need.
syntax = "proto3";

package build.bazel.remote.execution.v2;

message Digest {
  string hash = 1;
  int64 size_bytes = 2;
}

message NodeProperty {
  string name = 1;
  string value = 2;
}

message NodeProperties {
  repeated NodeProperty properties = 1;
  // mtime = 2 and unix_mode = 3 are google.protobuf wrappers this engine never
  // sets; an unset message field emits nothing, so omitting them here cannot
  // change the bytes.
}

message FileNode {
  string name = 1;
  Digest digest = 2;
  reserved 3;
  bool is_executable = 4;
  reserved 5;
  NodeProperties node_properties = 6;
}

message DirectoryNode {
  string name = 1;
  Digest digest = 2;
}

message SymlinkNode {
  string name = 1;
  string target = 2;
  reserved 3;
  NodeProperties node_properties = 4;
}

message Directory {
  repeated FileNode files = 1;
  repeated DirectoryNode directories = 2;
  repeated SymlinkNode symlinks = 3;
  reserved 4;
  NodeProperties node_properties = 5;
}

message Platform {
  message Property {
    string name = 1;
    string value = 2;
  }
  repeated Property properties = 1;
}

message Command {
  message EnvironmentVariable {
    string name = 1;
    string value = 2;
  }
  repeated string arguments = 1;
  repeated EnvironmentVariable environment_variables = 2;
  reserved 3, 4, 5;
  string working_directory = 6;
  repeated string output_paths = 7;
}

message Action {
  Digest command_digest = 1;
  Digest input_root_digest = 2;
  reserved 3, 4, 5, 6, 8;
  bool do_not_cache = 7;
  bytes salt = 9;
  Platform platform = 10;
}

message OutputDirectory {
  string path = 1;
  reserved 2;
  Digest tree_digest = 3;
  bool is_topologically_sorted = 4;
  Digest root_directory_digest = 5;
}

message ActionResult {
  reserved 1;
  repeated OutputFile output_files = 2;
  repeated OutputDirectory output_directories = 3;
  int32 exit_code = 4;
  bytes stdout_raw = 5;
  ExecutedActionMetadata execution_metadata = 6;
  reserved 7, 8, 9, 10, 11, 12;
}

// Only the fields this engine emits. A client may require the message to be
// present before it looks at anything inside it, which is why it is here at
// all.
message ExecutedActionMetadata {
  string worker = 1;
  reserved 2;
  Timestamp worker_start_timestamp = 3;
  Timestamp worker_completed_timestamp = 4;
  reserved 5, 6, 7, 8, 9, 10;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message OutputFile {
  string path = 1;
  Digest digest = 2;
  reserved 3;
  bool is_executable = 4;
}

message CacheCapabilities {
  repeated int32 digest_functions = 1;
  int64 max_batch_total_size_bytes = 4;
  int32 symlink_absolute_path_strategy = 5;
}

message ServerCapabilities {
  CacheCapabilities cache_capabilities = 1;
  reserved 2;
  SemVer low_api_version = 3;
  SemVer high_api_version = 4;
}

message SemVer {
  int32 major = 1;
  int32 minor = 2;
  int32 patch = 3;
}

message FindMissingBlobsRequest {
  string instance_name = 1;
  repeated Digest blob_digests = 2;
  int32 digest_function = 3;
}

message FindMissingBlobsResponse {
  repeated Digest missing_blob_digests = 2;
}

message BatchUpdateBlobsRequest {
  string instance_name = 1;
  repeated Request requests = 2;
  message Request {
    Digest digest = 1;
    bytes data = 2;
  }
}

message BatchUpdateBlobsResponse {
  repeated Response responses = 1;
  message Response {
    Digest digest = 1;
    Status status = 2;
  }
}

message Status {
  int32 code = 1;
  string message = 2;
}

message BatchReadBlobsRequest {
  string instance_name = 1;
  repeated Digest digests = 2;
}

message BatchReadBlobsResponse {
  repeated Response responses = 1;
  message Response {
    Digest digest = 1;
    bytes data = 2;
    Status status = 3;
  }
}

message GetActionResultRequest {
  string instance_name = 1;
  Digest action_digest = 2;
}

message ExecuteRequest {
  string instance_name = 1;
  bool skip_cache_lookup = 3;
  reserved 2, 4, 5;
  Digest action_digest = 6;
}

message ExecuteResponse {
  ActionResult result = 1;
  bool cached_result = 2;
  Status status = 3;
}

message Any {
  string type_url = 1;
  bytes value = 2;
}

message Operation {
  string name = 1;
  Any metadata = 2;
  bool done = 3;
  Status error = 4;
  Any response = 5;
}
