name: 'Stage 2 Setup'
description: 'Setup for self-hosted earth runners'
inputs:
  earthly_version:
    description: 'The earthly version to use'
    required: false
    default: 'latest'
  BUILT_EARTH_PATH:
    description: "Path to the built earth binary"
    required: true
  BINARY:
    description: "The container engine to use (e.g., 'docker' or 'podman')"
    required: true
  SUDO:
    description: "Sudo command if needed"
    required: false
  USE_QEMU:
    description: "Whether to set up QEMU"
    required: false
  USE_NEXT:
    description: "Whether to use earthly-next"
    required: false
    default: 'false'
  GHCR_USERNAME:
    description: "GHCR username (legacy - now uses github.actor)"
    required: false
  GHCR_PASSWORD:
    description: "GHCR password (legacy - now uses GITHUB_TOKEN)"
    required: false
  DOCKERHUB_USERNAME:
    description: "Docker Hub username (legacy - not needed with GCR mirror)"
    required: false
  DOCKERHUB_PASSWORD:
    description: "Docker Hub password (legacy - not needed with GCR mirror)"
    required: false
  DOCKERHUB_MIRROR_USERNAME:
    description: "Docker Hub mirror username (legacy - GCR mirror is public)"
    required: false
  DOCKERHUB_MIRROR_PASSWORD:
    description: "Docker Hub mirror password (legacy - GCR mirror is public)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Unset CI
      shell: bash
      run: |
        unset CI
    - name: Check if running on fork
      id: fork-check
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ] && [ "${GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME}" != "${{ github.repository }}" ]; then
          echo "is_fork=true" >> $GITHUB_OUTPUT
          echo "Running on fork - will use artifacts"
        else
          echo "is_fork=false" >> $GITHUB_OUTPUT
          echo "Running on main repo - will use GHCR"
        fi
      env:
        GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
    - name: Download build-earth artifacts
      # Always download. The artifact carries the buildkitd image tarball on
      # every run, and on fork PRs also the earth binary + tag-suffix.txt.
      # Loading the local tarball avoids a per-job ghcr pull of the staging
      # image.
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
      with:
        name: earth-build-latest${{ inputs.USE_NEXT == 'true' && '-ticktock' || '' }}
        path: ./build-artifacts
    - name: Setup earth binary from artifact (fork)
      if: steps.fork-check.outputs.is_fork == 'true'
      shell: bash
      run: |
        test -n "${INPUTS_BUILT_EARTH_PATH}" || (echo "BUILT_EARTH_PATH is empty" && exit 1)
        mkdir -p "$(dirname "${INPUTS_BUILT_EARTH_PATH}")"
        cp ./build-artifacts/earthly "${INPUTS_BUILT_EARTH_PATH}"
        chmod +x "${INPUTS_BUILT_EARTH_PATH}"
        echo "Earth binary installed from artifact to ${INPUTS_BUILT_EARTH_PATH}"
      env:
        INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
    - name: Set up Docker Hub Mirrors and ulimits for Docker 29+
      if: inputs.BINARY == 'docker'
      run: |
        sudo mkdir -p /etc/docker
        cat <<EOF | sudo tee /etc/docker/daemon.json
        {
          "registry-mirrors": [
            "https://mirror.gcr.io",
            "https://public.ecr.aws"
          ]
        }
        EOF
        for svc in docker containerd; do
          sudo mkdir -p /etc/systemd/system/${svc}.service.d
          printf '[Service]\nLimitNOFILE=1048576\n' | sudo tee /etc/systemd/system/${svc}.service.d/override.conf
        done
        sudo systemctl daemon-reload
        sudo systemctl restart containerd
        sudo systemctl restart docker
      shell: bash
    - name: Login to GHCR
      if: inputs.BINARY == 'docker' && steps.fork-check.outputs.is_fork != 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ env.GITHUB_TOKEN }}
    - name: Login to Docker Hub
      if: inputs.BINARY == 'docker' && inputs.DOCKERHUB_PASSWORD != '' && steps.fork-check.outputs.is_fork != 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.DOCKERHUB_USERNAME }}
        password: ${{ inputs.DOCKERHUB_PASSWORD }}
    - if: inputs.BINARY == 'docker'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      with:
        image: tonistiigi/binfmt:latest
        platforms: all
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '1.26.5'
    - if: ${{ inputs.BINARY == 'podman' }}
      name: Set up Podman
      run: |
        # Remove pre-installed Docker to avoid conflicts
        ${INPUTS_SUDO} apt-get purge -y docker-engine docker docker.io docker-ce docker-ce-cli
        ${INPUTS_SUDO} rm -f /usr/bin/docker

        ${INPUTS_SUDO} apt-get update
        ${INPUTS_SUDO} apt-get install -y podman

        # Create the config directory (system-wide)
        ${INPUTS_SUDO} mkdir -p /etc/containers/

        # Write the config using 'tee' to handle sudo permissions
        cat <<EOF | ${INPUTS_SUDO} tee /etc/containers/registries.conf
        unqualified-search-registries = ["docker.io"]

        [[registry]]
        prefix = "docker.io"
        location = "docker.io"

        [[registry.mirror]]
        location = "mirror.gcr.io"

        [[registry.mirror]]
        location = "public.ecr.aws"
        EOF
      shell: bash
      env:
        INPUTS_SUDO: ${{inputs.SUDO}}
    - if: ${{ inputs.BINARY == 'podman' && inputs.USE_QEMU }}
      # qemu-user-static needed for cross-compilation (--platform) targets
      run: ${INPUTS_SUDO} apt-get update && ${INPUTS_SUDO} apt-get install -y qemu-user-static
      shell: bash
      env:
        INPUTS_SUDO: ${{inputs.SUDO}}
    - name: Load buildkitd image from artifact
      # Must run AFTER the Docker and Podman setup steps above: on podman jobs
      # the engine is apt-installed there (and docker is purged), so loading any
      # earlier fails with `podman: command not found`.
      shell: bash
      run: |
        echo "Loading buildkitd image from artifact..."
        ${INPUTS_SUDO} "${INPUTS_BINARY}" load -i ./build-artifacts/buildkitd-image.tar
        echo "Buildkitd image loaded successfully"
      env:
        INPUTS_SUDO: ${{inputs.SUDO}}
        INPUTS_BINARY: ${{inputs.BINARY}}
    - name: Point outer buildkit at the PR's own staging image
      # Non-fork runs previously hardcoded the stable pinned buildkitd image.
      # That meant the outer layer ran the PR's earth CLI against the *old*
      # buildkit, and the PR's own buildkit was only exercised inside
      # earth-in-earth tests -- so an outer-daemon regression could pass CI.
      # Both paths now use the staging tag built for this SHA, which is the
      # tag `Load buildkitd image from artifact` just loaded, so MaybePull
      # finds it locally and skips the ghcr fetch.
      #
      # tag-suffix.txt is the single source of truth for the suffix: the build
      # job writes it alongside the tarball on every run, so this cannot drift
      # from the tag the tarball actually carries.
      #
      # Deliberately not gated on BINARY == 'docker': main's docker-only guard
      # belonged to the Docker-29 pinned-image workaround this step replaces.
      # Podman jobs must exercise the PR's buildkitd too.
      shell: bash
      # EARTHLY_BUILDKIT_IMAGE has to reach the caller's later steps, so
      # GITHUB_ENV is the only channel available to a composite action. The
      # value is constrained rather than trusted: TAG_SUFFIX is matched against
      # a strict character class before it is written, so a malformed
      # tag-suffix.txt cannot smuggle a newline (and hence a second env
      # assignment) into the file.
      run: |  # zizmor: ignore[github-env]
        set -euo pipefail
        TAG_SUFFIX=$(cat ./build-artifacts/tag-suffix.txt)
        if [[ ! "$TAG_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::refusing to use tag suffix '${TAG_SUFFIX}': expected [A-Za-z0-9._-]+"
          exit 1
        fi
        BUILDKIT_IMAGE="ghcr.io/earthbuild/earthbuild:buildkitd-staging-${GITHUB_SHA}-${TAG_SUFFIX}"
        echo "EARTHLY_BUILDKIT_IMAGE=${BUILDKIT_IMAGE}" >> "$GITHUB_ENV"
        echo "Set EARTHLY_BUILDKIT_IMAGE=${BUILDKIT_IMAGE}"
    - name: Get binary from GHCR (non-fork)
      if: steps.fork-check.outputs.is_fork != 'true'
      run: |-
        echo "Extracting earth binary from stage1 of build"
        export TAG=${GITHUB_SHA}-latest
        if [ "${INPUTS_USE_NEXT}" = "true" ]; then export TAG="$TAG-ticktock"; fi
        ${INPUTS_SUDO} ./earthly upgrade
        ${INPUTS_SUDO} chown -R $USER ~/.earthly # restore non-sudo user ownership
        test -n "${INPUTS_BUILT_EARTH_PATH}" || (echo "BUILT_EARTH_PATH is empty" && exit 1)
        mkdir -p "$(dirname "${INPUTS_BUILT_EARTH_PATH}")"
        ${INPUTS_SUDO} ls "${HOME}/.earthly/"
        ${INPUTS_SUDO} mv "${HOME}/.earthly/earthly-$TAG" "${INPUTS_BUILT_EARTH_PATH}"
        echo "extracted ${INPUTS_BUILT_EARTH_PATH}"
      shell: bash
      env:
        INPUTS_USE_NEXT: ${{inputs.USE_NEXT}}
        INPUTS_SUDO: ${{inputs.SUDO}}
        INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
    - run: |-
        echo "Configuring earthbuild to use GCR mirror"
        "${INPUTS_BUILT_EARTH_PATH}" config global.buildkit_additional_config "'[registry.\"docker.io\"]
        mirrors = [\"mirror.gcr.io\", \"public.ecr.aws\"]'"
      shell: bash
      env:
        INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
    - if: ${{ inputs.USE_NEXT == 'true' }}
      run: |-
        export expected_buildkit_client_sha="$(cat earthly-next | head -c 12)"
        test -n "$expected_buildkit_client_sha" || ( echo "expected_buildkit_client_sha is empty" && exit 1)
        (strings "${INPUTS_BUILT_EARTH_PATH}" | grep "$expected_buildkit_client_sha" ) || ( echo "expected to find $expected_buildkit_client_sha in earth binary" && exit 1)
        echo "correctly found $expected_buildkit_client_sha in earth binary; this confirms earthly-next was used"
      shell: bash
      env:
        INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
    - if: ${{ inputs.BINARY == 'podman' }}
      run: ${INPUTS_SUDO} "${INPUTS_BUILT_EARTH_PATH}" bootstrap
      shell: bash
      env:
        INPUTS_SUDO: ${{inputs.SUDO}}
        INPUTS_BUILT_EARTH_PATH: ${{inputs.BUILT_EARTH_PATH}}
    - run: echo "stage2-setup action complete"
      shell: bash
